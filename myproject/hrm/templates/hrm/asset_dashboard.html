{% extends 'base.html' %}
{% block title %}Asset Dashboard - HRM{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <h2><i class="fas fa-tachometer-alt me-2"></i>Asset Dashboard</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-3 mb-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-laptop fa-2x text-primary mb-2"></i>
                <h5 class="card-title">Total Assets</h5>
                <h3>0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                <h5 class="card-title">Assigned</h5>
                <h3>0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-box-open fa-2x text-warning mb-2"></i>
                <h5 class="card-title">Unassigned</h5>
                <h3>0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-tools fa-2x text-danger mb-2"></i>
                <h5 class="card-title">Under Maintenance</h5>
                <h3>0</h3>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body text-center text-muted py-4">
        <i class="fas fa-chart-bar fa-2x mb-2 d-block"></i>
        Asset dashboard details will be added soon.
    </div>
</div>
{% endblock %}
