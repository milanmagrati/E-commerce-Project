{% extends 'base.html' %}

{% block title %}{{ action }} Supplier - Purchase Management{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h4 class="mb-1"><i class="fas fa-user-plus me-2 text-primary"></i>{{ action }} Supplier</h4>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'purchase_dashboard' %}">Purchase Management</a></li>
                <li class="breadcrumb-item"><a href="{% url 'supplier_list' %}">Suppliers</a></li>
                <li class="breadcrumb-item active">{{ action }}</li>
            </ol>
        </nav>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-medium">Supplier Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ supplier.name|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ supplier.phone|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Address</label>
                            <textarea name="address" class="form-control" rows="3">{{ supplier.address|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Opening Balance (Rs.)</label>
                            <input type="number" step="0.01" name="opening_balance" class="form-control" value="{{ supplier.opening_balance|default:'0' }}">
                            <small class="text-muted">Amount owed to this supplier before using this system</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ action }} Supplier
                            </button>
                            <a href="{% url 'supplier_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
