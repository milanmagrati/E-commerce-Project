<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 - Server Error | Trendy Shopping</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 60px 48px;
      text-align: center;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #5e72e4, #825ee4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9; }
    p { font-size: 15px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #5e72e4, #825ee4);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .hint {
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <div class="code">500</div>
    <h1>Internal Server Error</h1>
    <p>
      Something went wrong on our end. Our team has been notified automatically
      and is working to fix it. Please try again in a moment.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        🏠 Go to Dashboard
      </a>
      <a href="javascript:location.reload()" class="btn btn-secondary">
        🔄 Try Again
      </a>
    </div>
    <p class="hint">Error reference: 500 &bull; If this persists, contact your system administrator.</p>
  </div>
</body>
</html>
